<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Онбординг: Скаут | Карета Мобилити</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* --- БАЗОВЫЕ СТИЛИ --- */
        :root { 
            --bg: #f4f6f8; 
            --text: #1a1a1a; 
            --yellow: #FFED00; 
            --black: #000; 
            --green: #2ecc71;
            --red: #e74c3c;
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); color: var(--text); padding: 15px; margin: 0; 
            text-align: center; overflow-x: hidden; -webkit-font-smoothing: antialiased; 
        }
        
        /* --- ЭКРАНЫ --- */
        .screen { 
            display: none; background: #fff; padding: 20px; border-radius: 24px; 
            margin-top: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            animation: fadeIn 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); 
        }
        .screen.active { display: block; }
        .center { text-align: center; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        /* --- ТИПОГРАФИКА И ФОРМЫ --- */
        h2 { text-transform: uppercase; font-size: 22px; margin-bottom: 10px; font-weight: 800; line-height: 1.2; }
        p { color: #555; font-size: 15px; line-height: 1.4; margin-bottom: 20px; }
        
        input { 
            width: 100%; padding: 16px; margin-top: 10px; border: 3px solid #eee; 
            border-radius: 14px; font-size: 18px; box-sizing: border-box; 
            text-align: center; font-weight: bold; outline: none; transition: 0.3s; background: #fafafa; 
        }
        input:focus { border-color: var(--yellow); background: #fff; }
        
        button { 
            background: var(--yellow); color: #000; border: none; padding: 18px; 
            border-radius: 14px; font-size: 18px; font-weight: 800; width: 100%; 
            margin-top: 20px; text-transform: uppercase; box-shadow: 0 5px 0 #d4c300; 
            cursor: pointer; transition: transform 0.1s; display: block; 
        }
        button:active { transform: translateY(3px); box-shadow: 0 2px 0 #d4c300; }
        button:disabled { background: #e0e0e0 !important; color: #a0a0a0 !important; box-shadow: none !important; cursor: not-allowed; transform: none; }
        
        .logo-main { width: 120px; height: auto; margin-bottom: 20px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }

        /* --- ROADMAP (ПУТЬ) --- */
        .step-card {
            background: #fff; border: 3px solid #eee; border-radius: 16px; padding: 15px; 
            margin-bottom: 15px; text-align: left; display: flex; align-items: center; transition: 0.3s;
        }
        .step-card.active-step { border-color: var(--yellow); box-shadow: 0 4px 15px rgba(255, 237, 0, 0.3); cursor: pointer; }
        .step-card.locked-step { opacity: 0.5; background: #fafafa; filter: grayscale(1); cursor: not-allowed; }
        .step-card.completed-step { border-color: var(--green); background: #f0fdf4; cursor: pointer; }
        .step-icon { font-size: 32px; margin-right: 15px; width: 40px; text-align: center; }
        .step-info h4 { margin: 0 0 4px 0; font-size: 16px; font-weight: 800; text-transform: uppercase; }
        .step-info p { margin: 0; font-size: 13px; color: #666; font-weight: 600; }
        .step-status { margin-left: auto; font-size: 20px; }

        /* --- TINDER КАРТОЧКИ --- */
        .tinder-container { position: relative; height: 60vh; min-height: 480px; width: 100%; margin-top: 10px; perspective: 1000px; }
        .tinder-card { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: #fff; border: 3px solid #eee; border-radius: 20px; 
            overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.08); 
            transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.4s; 
            display: flex; flex-direction: column; text-align: center; 
        }
        .tinder-card.swiped-left { transform: translateX(-200%) rotate(-30deg) !important; opacity: 0; }
        .tinder-card.swiped-right { transform: translateX(200%) rotate(30deg) !important; opacity: 0; }
        
        .card-img { width: 120px; height: 120px; margin: 30px auto 15px; object-fit: contain; flex-shrink: 0; }
        .card-text { padding: 0 20px 20px; font-size: 16px; line-height: 1.5; flex-grow: 1; overflow-y: auto; text-align: left; font-weight: 500; }
        .swipe-hint { font-size: 13px; color: #999; margin-top: 10px; animation: pulse 2s infinite; font-weight: 600; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        /* --- ИНТЕРАКТИВ И ПОП-АПЫ --- */
        .option { 
            display: flex; align-items: center; padding: 16px; background: #f8fafc; 
            margin-bottom: 12px; border-radius: 14px; cursor: pointer; text-align: left; 
            border: 2px solid #eee; font-weight: 700; font-size: 15px; transition: 0.2s; 
        }
        .option:active { transform: scale(0.98); }
        .option.correct { background: #dcfce7; border-color: var(--green); color: #166534; }
        .option.wrong { background: #fee2e2; border-color: var(--red); color: #991b1b; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 999; display: none; }
        .popup {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
            width: 85%; max-width: 350px; background: #fff; border-radius: 24px; padding: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); z-index: 1000; display: none;
            text-align: left; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn { to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
        .popup h3 { margin-top: 0; font-size: 22px; }
        .popup p { font-size: 16px; font-weight: 500; color: #333; margin-bottom: 0; }

        /* --- ОБЩЕЕ --- */
        .status-bar { display: flex; justify-content: space-between; font-weight: 800; background: var(--yellow); padding: 12px 20px; border-radius: 14px; margin-bottom: 15px; font-size: 14px; box-shadow: 0 4px 0 #d4c300; }
        .media-container { position: relative; border-radius: 16px; overflow: hidden; border: 2px solid #eee; background: #000; margin-bottom: 15px; }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .reset-btn { background: transparent; color: #999; border: none; box-shadow: none; margin-top: 25px; font-size: 14px; text-decoration: underline; }
    </style>
</head>
<body>

    <div id="statusBar" class="status-bar" style="display: none;">
        <span id="header-title">ВОПРОС: <span id="q-counter">1/3</span></span>
        <span>💰 <span id="coins">0</span></span>
    </div>

    <div id="overlay" class="overlay"></div>
    <div id="popup" class="popup">
        <h3 id="popup-title"></h3>
        <p id="popup-text"></p>
        <button onclick="closePopup()">ПОНЯТНО</button>
    </div>

    <div id="screen-reg" class="screen center active">
        <img src="logo.jpg" class="logo-main" alt="Карета Мобилити" onerror="this.src='https://via.placeholder.com/150?text=LOGO'">
        <h2>Привет, Скаут! 🚴‍♂️</h2>
        <p>Заполни анкету для старта.</p>
        <input type="text" id="user-name" placeholder="ФИО" oninput="validateForm()">
        <input type="tel" id="user-phone" value="+7 " maxlength="18" oninput="validateForm()">
        <input type="text" id="user-birth" placeholder="ДД.ММ.ГГГГ" oninput="formatDate(this); validateForm()" maxlength="10">
        <input type="text" id="user-city" placeholder="Город (например, Ростов)" oninput="validateForm()">
        <button id="btn-start" disabled onclick="saveAndGo()">Начать Путь</button>
    </div>

    <div id="screen-roadmap" class="screen">
        <h2>Твоё обучение</h2>
        <p style="margin-bottom: 25px;">Пройди все этапы по порядку.</p>
        <div id="roadmap-container"></div>
        <button class="reset-btn" onclick="resetApp()">🔄 Начать всё заново</button>
    </div>

    <div id="screen-theory-video" class="screen center">
        <h2>1. Видео-база</h2>
        <div class="media-container">
            <div class="video-wrapper">
                <iframe id="onboarding-video" src="https://rutube.ru/play/embed/900cde7cfae7ff125a6a7da1d8d9ce96/?p=x-I4ULg0MU6OYQodDqvM4Q" frameBorder="0" allow="autoplay; fullscreen"></iframe>
            </div>
        </div>
        <button style="background:var(--green); color:white; box-shadow:0 5px 0 #27ae60;" onclick="completeStep(1)">✅ Посмотрел</button>
        <button style="background:#fff; color:#000; border:2px solid #eee; margin-top:10px; box-shadow:none;" onclick="showScreen('screen-roadmap')">В меню</button>
    </div>

    <div id="screen-practice" class="screen">
        <h3 id="prac-text" style="font-size: 19px; line-height: 1.4; margin-bottom: 20px; font-weight: 800;"></h3>
        <div id="prac-options"></div>
    </div>

    <div id="screen-theory-cards" class="screen center">
        <h2>3. База Знаний</h2>
        <div class="swipe-hint">Листай текст ⬇️, смахивай ➡️</div>
        <div class="tinder-container" id="tinder-deck"></div>
        <button id="btn-cards-finish" style="display:none; background:var(--green); color:white; box-shadow:0 5px 0 #27ae60;" onclick="completeStep(3)">✅ Готово</button>
        <button style="background:#fff; color:#000; border:2px solid #eee; margin-top:10px; box-shadow:none;" onclick="showScreen('screen-roadmap')">В меню</button>
    </div>

    <div id="screen-theory-audio" class="screen center">
        <h2>5. Инструктаж ТМ</h2>
        <div style="background:#f4f4f4; padding:30px; border-radius:20px; margin-bottom:20px;">
            <div style="font-size:50px; margin-bottom:10px;">🎧</div>
            <p style="margin-bottom:15px; font-weight:bold;">Слушай внимательно</p>
            <audio id="onboarding-audio" controls style="width: 100%; border-radius: 50px;">
                <source src="podcast.m4a" type="audio/mp4">
            </audio>
        </div>
        <button style="background:var(--green); color:white; box-shadow:0 5px 0 #27ae60;" onclick="completeStep(5)">✅ Прослушал</button>
        <button style="background:#fff; color:#000; border:2px solid #eee; margin-top:10px; box-shadow:none;" onclick="showScreen('screen-roadmap')">В меню</button>
    </div>

    <div id="screen-finish" class="screen center">
        <img src="logo.jpg" class="logo-main" onerror="this.src='https://via.placeholder.com/150?text=WIN'">
        <h2 id="finish-title">Результат</h2>
        <p id="res-info" style="font-size:18px; font-weight:bold; color:#000; margin-bottom: 15px;"></p>
        
        <div style="background:var(--yellow); padding:20px; border-radius: 18px; margin: 20px 0; box-shadow: 0 6px 0 #d4c300;" id="coin-box">
            <p style="margin:0; font-size: 14px; font-weight: bold; text-transform: uppercase;">Заработано монет:</p>
            <h3 style="margin:5px 0 0 0; font-size: 38px; font-weight: 900;">💰 <span id="res-coins">0</span></h3>
        </div>
        
        <p id="send-status" style="font-weight: bold; font-size: 16px;"></p>
        
        <button id="btn-close" disabled onclick="tg.close()" style="display:none; background:var(--green); box-shadow: 0 6px 0 #27ae60; color:white;">Закрыть обучение</button>
        <button id="btn-retry" onclick="showScreen('screen-roadmap')" style="display:none; background:var(--red); box-shadow: 0 6px 0 #c0392b; color:white;">На пересдачу</button>
    </div>

    <script>
        const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbxAOyN8XERwNRQRqd80VQOQOXGnujqTpqprFyTMIxa8RM-JzWYA6SYtYTnTKf_AKfAc/exec";
        let tg = window.Telegram.WebApp; tg.expand();

        let userData = { name: "", phone: "", city: "", birth: "", score: 0, coins: 0 };
        let currentProgressStep = 1;

        const roadmapData = [
            { id: 1, type: 'video', icon: '📺', title: 'Обзор работы', desc: 'Видео-инструкция' },
            { id: 2, type: 'practice', icon: '🤝', title: 'Симуляция 1', desc: 'Работа с клиентами' },
            { id: 3, type: 'cards', icon: '📖', title: 'Стандарты', desc: '8 правил парковки' },
            { id: 4, type: 'practice', icon: '🛠', title: 'Симуляция 2', desc: 'Сложные ситуации' },
            { id: 5, type: 'audio', icon: '🎧', title: 'Подкаст ТМ', desc: 'Аудио напутствие' },
            { id: 6, type: 'quiz', icon: '🏆', title: 'Экзамен', desc: 'Финальный тест' }
        ];

        // ВОЗВРАЩЕНЫ ВСЕ 8 КАРТОЧЕК
        const theoryCards = [
            { t: "<b>👔 1. СТАНДАРТ СЕРВИСА</b><br><br>Мы — премиум бренд. Твой внешний вид и поведение — лицо компании.<br>• Запрещено курить/есть на Карете.<br>• Форма должна быть чистой.<br>• Общайся с улыбкой.", img: "1.png" }, 
            { t: "<b>🅿️ 2. ИДЕАЛЬНАЯ ПАРКОВКА</b><br><br>• Ставь Кареты в ровную линию.<br>• Расстояние — ровно <b>50 см</b>.<br>• Руль и фары смотрят прямо.", img: "2.png" },
            { t: "<b>⚖️ 3. БАЛАНС ПАРКОВКИ</b><br><br>Много карет? Угони лишние на соседнюю пустую точку. Клиенты не должны ждать в очереди.", img: "3.png" },
            { t: "<b>🤝 4. ТЫ — ЭКСПЕРТ</b><br><br>Знай тарифы, помогай скачивать приложение, советуй маршруты в парке.", img: "4.png" },
            { t: "<b>📱 5. ЗАРПЛАТА И СМЕНА</b><br><br>Старт смены строго через Telegram-бота. Обязательно делай <b>селфи в форме</b>. Нет отметки = нет зарплаты.", img: "5.png" },
            { t: "<b>🛠 6. РАБОЧИЙ ИНВЕНТАРЬ</b><br><br>В пилоне лежат: ключи на 13 и 15, отвертка, стяжки, микрофибра и жесткая щетка для песка.", img: "6.png" },
            { t: "<b>🔧 7. ПОЛОМКИ И РЕМОНТ</b><br><br>Мелкое — чини сам. Серьезное (трещина, колесо) — <b>заявка в бот</b> и снимай Карету с линии.", img: "7.png" },
            { t: "<b>🎧 8. АУДИОГИД</b><br><br>Предлагай аудиогид (за 1 рубль) абсолютно каждому клиенту перед стартом.", img: "8.png" }
        ];

        // 3х3 СИМУЛЯЦИИ С ПОП-АП ФИДБЕКОМ
        const simsData = {
            2: [
                { q: "Мимо точки проходит семья. Ребенок смотрит на веломобиль, но родители идут дальше. Твои действия?", a: [
                    { t: "Буду стоять молча. Если им реально нужно, сами подойдут.", c: false, f: "Так мы теряем клиентов. Скаут должен быть проактивным." },
                    { t: "Громко крикну: «Эй, прокатитесь! Дам скидку 50%!»", c: false, f: "Звучит агрессивно, плюс мы теряем выручку из-за необоснованной скидки." },
                    { t: "Улыбнусь и предложу малышу посидеть за рулем и сделать бесплатное фото.", c: true, f: "Отличный заход для вовлечения без давления!" }
                ]},
                { q: "К тебе подходят 6 подростков на 4-местную карету: «Да мы худенькие, все поместимся!»", a: [
                    { t: "Сдам им карету. Главное, что они платят деньги.", c: false, f: "Грубое нарушение ТБ. Огромный риск травм и поломки осей." },
                    { t: "Скажу: «Ладно, но если что-то сломаете — платите втройне».", c: false, f: "Мы вообще не должны допускать таких ситуаций на старте." },
                    { t: "Твердо откажу, объясню правила и предложу взять две кареты.", c: true, f: "Сохраняем технику, соблюдаем ТБ и делаем доп. продажу." }
                ]},
                { q: "Начало апреля. Ты вышел на смену, клиентов пока мало. Чем заняться?", a: [
                    { t: "Буду сидеть в телефоне, пока кто-нибудь не подойдет.", c: false, f: "Точка должна выглядеть привлекательно, а сотрудник — готовым к работе." },
                    { t: "Протру пыль с карет, проверю давление в шинах, повторю скрипты.", c: true, f: "Свободное время используем для подготовки." },
                    { t: "Закрою точку и пойду попью кофе, раз никого нет.", c: false, f: "Оставленная без присмотра точка — это грубое нарушение." }
                ]}
            ],
            4: [
                { q: "Начинает накрапывать мелкий дождь. Клиенты сомневаются: «Наверное, не поедем, промокнем».", a: [
                    { t: "Соглашусь с ними: «Да, лучше приходите завтра».", c: false, f: "Вы просто отпустили «горячих» клиентов и потеряли выручку." },
                    { t: "Предложу им поехать за полцены, чтобы хоть что-то заработать.", c: false, f: "Необоснованные скидки обесценивают наш продукт." },
                    { t: "Скажу: «Не переживайте, у карет отличная крыша-тент! Вы не промокнете».", c: true, f: "Отличная работа с возражениями." }
                ]},
                { q: "К точке подходит шумная компания. От них сильно пахнет алкоголем, они шатаются.", a: [
                    { t: "Сдам карету, но попрошу двойной залог на случай поломки.", c: false, f: "Залог не покроет риск травм. Пьяный клиент за рулем — угроза парку." },
                    { t: "Постараюсь их не замечать, вдруг сами уйдут.", c: false, f: "Игнорирование может спровоцировать агрессию." },
                    { t: "Вежливо, но очень твердо откажу в аренде по правилам безопасности.", c: true, f: "Безопасность превыше всего. Таким клиентам услуга не оказывается." }
                ]},
                { q: "Звонит клиент: «Мы уехали в дальний конец парка, и у нас слетела цепь».", a: [
                    { t: "Скажу: «Попробуйте натянуть сами, там несложно».", c: false, f: "Клиент пришел отдыхать, а не чинить технику. Это портит впечатление." },
                    { t: "Скажу: «Бросайте карету там, залог не верну, вы её сломали».", c: false, f: "Конфликт на ровном месте. Цепь могла слететь не по их вине." },
                    { t: "Успокою клиента, уточню геопозицию и отправлю свободного сотрудника.", c: true, f: "Сервисный подход. Быстро и без нервов решаем проблему." }
                ]}
            ]
        };

        const finalQuizData = [
            { q: "Как фиксируется рабочее время?", a: [{t: "Через Telegram-бот (селфи)", c:true}, {t: "В блокноте", c:false}, {t: "На словах", c:false}] },
            { q: "Расстояние между каретами на парковке?", a: [{t: "1 метр", c:false}, {t: "Ровно 50 см", c:true}, {t: "Вплотную", c:false}] },
            { q: "Какие ключи нужны для мелкого ремонта?", a: [{t: "На 10 и 12", c:false}, {t: "Разводной", c:false}, {t: "На 13 и 15", c:true}] },
            { q: "Сломалась рама (трещина). Твои действия?", a: [{t: "Скрыть поломку", c:false}, {t: "Замотать скотчем", c:false}, {t: "Снять с линии + заявка в бот", c:true}] },
            { q: "Правило чистоты — это...", a: [{t: "Только сиденья", c:false}, {t: "Сиденья, рама, колеса до блеска", c:true}, {t: "Сбить пыль", c:false}] }
        ];

        // --- ИНИЦИАЛИЗАЦИЯ И ФОРМЫ (ВОССТАНОВЛЕНО) ---
        window.addEventListener('DOMContentLoaded', () => {
            let n = localStorage.getItem('scoutName');
            if (n && n.length > 1) {
                userData.name = n;
                userData.phone = localStorage.getItem('scoutPhone');
                userData.city = localStorage.getItem('scoutCity') || "";
                userData.birth = localStorage.getItem('scoutBirth') || "";
                currentProgressStep = parseInt(localStorage.getItem('scoutProgress') || 1);
                userData.coins = parseInt(localStorage.getItem('scoutCoins') || 0);
                
                document.getElementById('user-name').value = userData.name;
                document.getElementById('user-phone').value = userData.phone;
                document.getElementById('user-city').value = userData.city;
                document.getElementById('user-birth').value = userData.birth;
                
                renderRoadmap(); showScreen('screen-roadmap');
            } else {
                showScreen('screen-reg');
            }
        });

        function resetApp() { if (confirm("Точно хочешь удалить все данные и начать заново?")) { localStorage.clear(); location.reload(); } }
        
        function formatDate(input) {
            let v = input.value.replace(/\D/g, ''); 
            if (v.length > 2) v = v.slice(0, 2) + '.' + v.slice(2);
            if (v.length > 5) v = v.slice(0, 5) + '.' + v.slice(5, 9);
            input.value = v;
        }

        function validateForm() {
            let n = document.getElementById('user-name').value.trim();
            let c = document.getElementById('user-city').value.trim();
            let b = document.getElementById('user-birth').value.trim();
            let p = document.getElementById('user-phone');
            let digits = p.value.replace(/\D/g, '');
            if (digits.startsWith('7') || digits.startsWith('8')) digits = digits.substring(1);
            p.value = digits.length > 0 ? '+7' + digits : '+7'; 
            document.getElementById('btn-start').disabled = !(n.length > 2 && c.length > 2 && b.length === 10 && digits.length >= 10);
        }

        function saveAndGo() {
            userData.name = document.getElementById('user-name').value;
            userData.phone = document.getElementById('user-phone').value;
            userData.city = document.getElementById('user-city').value;
            userData.birth = document.getElementById('user-birth').value;
            localStorage.setItem('scoutName', userData.name);
            localStorage.setItem('scoutPhone', userData.phone);
            localStorage.setItem('scoutCity', userData.city);
            localStorage.setItem('scoutBirth', userData.birth);
            renderRoadmap(); showScreen('screen-roadmap');
        }

        function stopMedia() {
            let audio = document.getElementById('onboarding-audio'); if (audio) { audio.pause(); audio.currentTime = 0; }
            let video = document.getElementById('onboarding-video'); if (video) { let s = video.src; video.src = ''; video.src = s; }
        }

        function showScreen(id) {
            stopMedia();
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('statusBar').style.display = (id === 'screen-practice') ? 'flex' : 'none';
        }

        // --- ROADMAP ---
        function renderRoadmap() {
            const container = document.getElementById('roadmap-container'); container.innerHTML = '';
            roadmapData.forEach(s => {
                let statusClass = s.id < currentProgressStep ? 'completed-step' : (s.id === currentProgressStep ? 'active-step' : 'locked-step');
                let statusIcon = statusClass === 'completed-step' ? '✅' : (statusClass === 'active-step' ? '▶️' : '🔒');
                container.innerHTML += `
                    <div class="step-card ${statusClass}" onclick="handleStepClick(${s.id})">
                        <div class="step-icon">${s.icon}</div>
                        <div class="step-info"><h4>Шаг ${s.id}: ${s.title}</h4><p>${s.desc}</p></div>
                        <div class="step-status">${statusIcon}</div>
                    </div>
                `;
            });
            document.getElementById('coins').innerText = userData.coins;
        }

        function handleStepClick(id) {
            if (id > currentProgressStep) { tg.HapticFeedback.notificationOccurred('warning'); return; }
            tg.HapticFeedback.impactOccurred('light');
            if (id === 1) showScreen('screen-theory-video');
            if (id === 2) startPractice(2);
            if (id === 3) startCards();
            if (id === 4) startPractice(4);
            if (id === 5) showScreen('screen-theory-audio');
            if (id === 6) startFinalQuiz();
        }

        function completeStep(id) {
            if (currentProgressStep === id) {
                currentProgressStep++;
                localStorage.setItem('scoutProgress', currentProgressStep);
                tg.HapticFeedback.notificationOccurred('success');
            }
            renderRoadmap(); showScreen('screen-roadmap');
        }

        // --- ДВИЖОК ПРАКТИКИ / ЭКЗАМЕНА ---
        let currentPracArr = [], pracIdx = 0, isQuizMode = false;

        function startPractice(id) { currentPracArr = simsData[id].sort(() => Math.random() - 0.5); pracIdx = 0; isQuizMode = false; document.getElementById('header-title').innerHTML = `СИМУЛЯЦИЯ: <span id="q-counter"></span>`; showScreen('screen-practice'); renderPracQ(); }
        function startFinalQuiz() { currentPracArr = finalQuizData.sort(() => Math.random() - 0.5); pracIdx = 0; userData.score = 0; isQuizMode = true; document.getElementById('header-title').innerHTML = `ЭКЗАМЕН: <span id="q-counter"></span>`; showScreen('screen-practice'); renderPracQ(); }

        function renderPracQ() {
            let q = currentPracArr[pracIdx];
            document.getElementById('q-counter').innerText = `${pracIdx + 1}/${currentPracArr.length}`;
            document.getElementById('prac-text').innerText = q.q;
            let shuffled = [...q.a].sort(() => Math.random() - 0.5);
            document.getElementById('prac-options').innerHTML = shuffled.map(opt => `<div class="option" onclick='handleAns(${JSON.stringify(opt)}, this)'>${opt.t}</div>`).join('');
            document.getElementById('coins').innerText = userData.coins;
        }

        function handleAns(opt, el) {
            document.querySelectorAll('#prac-options .option').forEach(o => o.style.pointerEvents = 'none'); // Блок кнопок
            
            if (isQuizMode) {
                // В экзамене без поп-апов
                if (opt.c) { el.classList.add('correct'); userData.score++; } else { el.classList.add('wrong'); }
                setTimeout(() => {
                    pracIdx++; if (pracIdx < currentPracArr.length) renderPracQ(); else showFinish();
                }, 500);
            } else {
                // В симуляции показываем ПОП-АП
                if (opt.c) {
                    el.classList.add('correct');
                    userData.coins += 50; localStorage.setItem('scoutCoins', userData.coins);
                    showPopup("✅ ВЕРНО!", opt.f, true);
                } else {
                    el.classList.add('wrong');
                    showPopup("❌ ОШИБКА!", opt.f, false);
                }
            }
        }

        function showPopup(title, text, isCorrect) {
            document.getElementById('popup-title').innerText = title;
            document.getElementById('popup-title').style.color = isCorrect ? 'var(--green)' : 'var(--red)';
            document.getElementById('popup-text').innerHTML = text;
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('popup').style.display = 'block';
            tg.HapticFeedback.notificationOccurred(isCorrect ? 'success' : 'error');
        }

        function closePopup() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('popup').style.display = 'none';
            pracIdx++;
            if (pracIdx < currentPracArr.length) renderPracQ(); else completeStep(currentProgressStep);
        }

        // --- TINDER КАРТОЧКИ ---
        let currentCardIndex = 0;
        function startCards() { currentCardIndex = 0; showScreen('screen-theory-cards'); renderCard(); }
        function renderCard() {
            const deck = document.getElementById('tinder-deck'); deck.innerHTML = ''; 
            let item = theoryCards[currentCardIndex], card = document.createElement('div');
            card.className = 'tinder-card';
            card.innerHTML = `
                <div style="position:absolute; top:12px; right:12px; font-weight:900; background:var(--yellow); padding:5px 12px; border-radius:10px; font-size:14px;">${currentCardIndex + 1} / ${theoryCards.length}</div>
                <img src="${item.img}" class="card-img" onerror="this.src='https://via.placeholder.com/120?text=IMG';">
                <div class="card-text">${item.t}</div>
            `;
            deck.appendChild(card); setupSwipe(card);
            document.getElementById('btn-cards-finish').style.display = (currentCardIndex >= theoryCards.length - 1) ? 'block' : 'none';
        }
        function setupSwipe(card) {
            let startX = 0, isDragging = false, isScrolling = false;
            card.ontouchstart = e => { startX = e.touches[0].clientX; isDragging = true; isScrolling = false; card.style.transition = 'none'; };
            card.ontouchmove = e => { 
                if (!isDragging) return; 
                let diffX = e.touches[0].clientX - startX;
                if (!isScrolling && Math.abs(e.touches[0].clientY - e.touches[0].clientY) > Math.abs(diffX)) { isScrolling = true; isDragging = false; card.style.transform = 'translate(0)'; return; }
                if (isScrolling) return;
                card.style.transform = `translateX(${diffX}px) rotate(${diffX/25}deg)`; 
            };
            card.ontouchend = e => {
                if (isScrolling) { isScrolling = false; return; }
                isDragging = false; card.style.transition = 'transform 0.4s cubic-bezier(0.23, 1, 0.32, 1)';
                let diffX = e.changedTouches[0].clientX - startX;
                if (diffX > 100 && currentCardIndex < theoryCards.length - 1) { tg.HapticFeedback.impactOccurred('medium'); card.classList.add('swiped-right'); currentCardIndex++; setTimeout(renderCard, 300); } 
                else if (diffX < -100 && currentCardIndex > 0) { tg.HapticFeedback.impactOccurred('medium'); card.classList.add('swiped-left'); currentCardIndex--; setTimeout(renderCard, 300); } 
                else { card.style.transform = 'translate(0)'; }
            };
        }

        // --- ФИНАЛ И ОТПРАВКА ---
        function showFinish() {
            showScreen('screen-finish');
            document.getElementById('res-info').innerText = userData.name;
            
            if (userData.score < 4) {
                document.getElementById('finish-title').innerText = "Тест не сдан ❌";
                document.getElementById('send-status').innerText = `Нужно минимум 4 из 5 (у тебя ${userData.score})`;
                document.getElementById('send-status').style.color = "var(--red)";
                document.getElementById('coin-box').style.display = "none";
                document.getElementById('btn-close').style.display = "none";
                document.getElementById('btn-retry').style.display = "block";
            } else {
                document.getElementById('res-coins').innerText = userData.coins;
                document.getElementById('finish-title').innerText = "Экзамен сдан! ✅";
                document.getElementById('send-status').innerText = "Отправка результатов...";
                document.getElementById('send-status').style.color = "var(--green)";
                document.getElementById('coin-box').style.display = "block";
                document.getElementById('btn-close').style.display = "block";
                document.getElementById('btn-retry').style.display = "none";
                
                const payload = JSON.stringify({
                    name: userData.name, phone: userData.phone, city: userData.city, birth: userData.birth,
                    role: "Скаут", score: userData.score, coins: userData.coins,
                    tg_user: tg.initDataUnsafe.user ? tg.initDataUnsafe.user.username : "скрыт"
                });

                fetch(GOOGLE_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: payload })
                .then(() => { document.getElementById('send-status').innerText = "✅ ДАННЫЕ В ТАБЛИЦЕ!"; document.getElementById('btn-close').disabled = false; });
            }
        }
    </script>
</body>
